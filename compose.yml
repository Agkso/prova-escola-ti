services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    image: prova-escola-ti
    ports:
      - "9202:8080"
    volumes:
      - fila-dados:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  fila-dados: